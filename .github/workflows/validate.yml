name: Validate manager

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Install locked Python dependencies
        run: uv sync --locked --python 3.13
      - name: Check manager behavior with isolated fixtures
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check
